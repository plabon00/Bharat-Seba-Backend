version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: learning_portal_db
    environment:
      POSTGRES_USER: ${DB_USER:-learning_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learning_password}
      POSTGRES_DB: ${DB_NAME:-learning_portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
